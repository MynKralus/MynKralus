<svg width="1400" height="300" viewBox="0 0 1400 300" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1220"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2563eb"/>
    <stop offset="100%" stop-color="#123b87"/>
  </linearGradient>
</defs>

<!-- Outer frame -->
<rect width="1400" height="300" fill="#080d15"/>
<rect x="28" y="30" width="1344" height="240" rx="20"
      fill="url(#bg)" stroke="#1f66ad" stroke-width="3"/>

<!-- Logo -->
<rect x="54" y="72" width="150" height="150" rx="10"
      fill="#050505" stroke="#18a0ff" stroke-width="4"/>
<text x="129" y="145" text-anchor="middle"
      fill="#d6d8dc" font-family="Georgia,Times New Roman,serif"
      font-size="48" font-weight="700">Kn</text>
<text x="129" y="185" text-anchor="middle"
      fill="#8f9298" font-family="Georgia,Times New Roman,serif"
      font-size="30" font-weight="700">R</text>
<text x="129" y="204" text-anchor="middle"
      fill="#666a70" font-family="Segoe UI,Arial,sans-serif"
      font-size="8" letter-spacing="1.3">MYNKRALUS</text>

<!-- Brand -->
<text x="230" y="95" fill="#d7dee8"
      font-family="Segoe UI,Arial,sans-serif" font-size="20">Made in</text>
<text x="230" y="140" fill="#ffffff"
      font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">MynKralus</text>
<text x="230" y="172" fill="#aeb9c8"
      font-family="Segoe UI,Arial,sans-serif" font-size="17">Dijital Dünya'nın Kaliteli Adresi</text>

<!-- Navigation buttons: 12px gaps, equal size -->
<g font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#ffffff">

<a href="https://mynkralus.gt.tc/">
<rect x="690" y="75" width="150" height="150" rx="16" fill="url(#btn)" stroke="#1597ff" stroke-width="3"/>
<path d="M736 133 l29 -25 29 25 v39 h-19 v-24 h-20 v24 h-19z" fill="#fff"/>
<text x="765" y="198" text-anchor="middle" font-size="17">Ana Sayfa</text>
</a>

<a href="https://mynkralus.gt.tc/Game.html">
<rect x="852" y="75" width="150" height="150" rx="16" fill="url(#btn)" stroke="#1597ff" stroke-width="3"/>
<path d="M885 145 q7 -25 26 -25 h31 q19 0 26 25 l6 22 q3 14 -10 14 q-9 0 -16 -12 l-5 -8 h-27 l-5 8 q-7 12 -16 12 q-13 0 -10 -14z"
      fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
<path d="M900 141 h14 m-7 -7 v14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<circle cx="968" cy="137" r="4" fill="#fff"/>
<circle cx="981" cy="146" r="4" fill="#fff"/>
<text x="927" y="198" text-anchor="middle" font-size="17">Oyunlar</text>
</a>

<a href="https://mynkralus.gt.tc/kuvaidle.html">
<rect x="1014" y="75" width="150" height="150" rx="16" fill="url(#btn)" stroke="#1597ff" stroke-width="3"/>
<path d="M1055 124 h23 v-8 q0 -10 10 -10 q10 0 10 10 v8 h23 v23 h8 q10 0 10 10 q0 10 -10 10 h-8 v23 h-23 v-8 q0 -10 -10 -10 q-10 0 -10 10 v8 h-23 v-23 h-8 q-10 0 -10 -10 q0 -10 10 -10 h8z"
      fill="#fff"/>
<text x="1089" y="198" text-anchor="middle" font-size="17">KuVaidle</text>
</a>

<a href="https://mynkralus.gt.tc/İletisim.html">
<rect x="1176" y="75" width="150" height="150" rx="16" fill="url(#btn)" stroke="#1597ff" stroke-width="3"/>
<rect x="1215" y="117" width="72" height="54" rx="8"
      fill="none" stroke="#fff" stroke-width="6"/>
<path d="M1219 121 l32 25 32 -25" fill="none" stroke="#fff" stroke-width="6"/>
<text x="1251" y="198" text-anchor="middle" font-size="17">İletişim</text>
</a>

</g>
</svg>